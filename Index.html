<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>متجري</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 10px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.product{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 2px 8px #0002;
}

.photo{
    height:150px;
    background:#e5e7eb;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.product h3{
    margin-bottom:5px;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:10px 0;
}

.wholesale{
    color:#15803d;
    font-weight:bold;
}

button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:16px;
    margin-top:10px;
    cursor:pointer;
}

.cart{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
}

.item{
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.item-name{
    font-weight:bold;
    flex:1;
}

.item-price{
    white-space:nowrap;
}

.qty-controls{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:9px;
}

.qty-btn{
    width:40px;
    height:40px;
    padding:0;
    margin:0;
    background:#374151;
    font-size:20px;
}

.qty{
    min-width:30px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
}

.remove-btn{
    width:auto;
    margin:0;
    padding:8px 12px;
    background:#dc2626;
    font-size:14px;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

.whatsapp{
    background:#25d366;
}

.empty{
    text-align:center;
    color:#666;
    padding:15px;
}

</style>
</head>
