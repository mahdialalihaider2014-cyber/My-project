<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 10px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.product{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 2px 8px #0002;
}

.photo{
    height:150px;
    background:#e5e7eb;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.product h3{
    margin-bottom:5px;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:10px 0;
}

.wholesale{
    color:#15803d;
    font-weight:bold;
}

button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:16px;
    margin-top:10px;
}

.cart{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

.whatsapp{
    background:#25d366;
}
</style>
</head>

<body>

<header>
<h1>🛍️ متجرنا</h1>
<p>أهلاً بكم في متجرنا الإلكتروني</p>
</header>

<div class="container">

<h2>المنتجات</h2>

<div class="products">

<div class="product">
<div class="photo">📦</div>
<h3>المنتج الأول</h3>
<p>وصف المنتج</p>
<div class="price">10,000 د.ع</div>
<div class="wholesale">الجملة: 9,000 د.ع</div>
<button onclick="add('المنتج الأول',10000)">
أضف إلى السلة
</button>
</div>

<div class="product">
<div class="photo">📦</div>
<h3>المنتج الثاني</h3>
<p>وصف المنتج</p>
<div class="price">20,000 د.ع</div>
<div class="wholesale">الجملة: 18,000 د.ع</div>
<button onclick="add('المنتج الثاني',20000)">
أضف إلى السلة
</button>
</div>

<div class="product">
<div class="photo">📦</div>
<h3>المنتج الثالث</h3>
<p>وصف المنتج</p>
<div class="price">30,000 د.ع</div>
<div class="wholesale">الجملة: 27,000 د.ع</div>
<button onclick="add('المنتج الثالث',30000)">
أضف إلى السلة
</button>
</div>

</div>

<div class="cart">

<h2>🛒 السلة</h2>

<div id="cart">
السلة فارغة
</div>

<div class="total">
المجموع: <span id="total">0</span> د.ع
</div>

<button class="whatsapp" onclick="order()">
📱 إرسال الطلب عبر واتساب
</button>

</div>

</div>

<script>

let cart=[];

function add(name,price){

cart.push({
name:name,
price:price
});

show();

}

function show(){

let box=document.getElementById("cart");
let total=0;

box.innerHTML="";

cart.forEach(function(x){

total+=x.price;

box.innerHTML+=
'<div class="item">'+
'<span>'+x.name+'</span>'+
'<span>'+x.price.toLocaleString()+' د.ع</span>'+
'</div>';

});

if(cart.length===0){
box.innerHTML="السلة فارغة";
}

document.getElementById("total").innerText=
total.toLocaleString();

}

function order(){

if(cart.length===0){

alert("السلة فارغة");
return;

}

let message="السلام عليكم، أريد طلب:%0A%0A";
let total=0;

cart.forEach(function(x){

message+="• "+x.name+
" - "+x.price.toLocaleString()+
" د.ع%0A";

total+=x.price;

});

message+="%0Aالمجموع: "+
total.toLocaleString()+" د.ع";

let phone="9647XXXXXXXXX";

window.open(
"https://wa.me/"+phone+"?text="+message,
"_blank"
);

}

</script>

</body>
</html>
